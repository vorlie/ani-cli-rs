[package]
name = "ani-cli-rs"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cross-platform Rust port of ani-cli with an AllAnime scraper"

[lib]
name = "ani_cli"
path = "src/lib.rs"

[[bin]]
name = "ani-cli-rs"
path = "src/main.rs"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ctr = "0.9"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
directories = "6"
futures-util = "0.3"
hex = "0.4"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
