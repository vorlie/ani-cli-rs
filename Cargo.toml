[package]
name = "ani-cli-rs"
version = "0.10.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Cross-platform Rust port of ani-cli with Anikoto providers and a reusable provider/playback library"
repository = "https://github.com/vorlie/ani-cli-rs"
homepage = "https://github.com/vorlie/ani-cli-rs"
documentation = "https://vorlie.github.io/ani-cli-rs/"
readme = "README.md"
keywords = ["anime", "ani-cli", "streaming", "media", "playback"]
categories = ["multimedia", "command-line-utilities"]

[lib]
name = "ani_lib"
path = "src/lib.rs"

[[bin]]
name = "ani-cli-rs"
path = "src/main.rs"

[[bin]]
name = "ani-cli-rs-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe"]

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
directories = "6"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"], optional = true }
egui_material_icons = { version = "0.3" }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hex = "0.4"
regex = "1.11"
scraper = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls-native-roots", "rustls-tls-webpki-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
wiremock = "0.6"
